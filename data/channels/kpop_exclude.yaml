# kpop channel IDs to exclude regardless of source (e.g. mislabeled entries).
# - channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
#
# kworb seeds this genre from Korea's YouTube chart, which ranks whatever
# charts *in* Korea rather than what is Korean - so international acts with
# a Korean audience arrive tagged as kpop. Their uploads are also labelled
# impeccably by their own labels ("Official Video", "Official Lyric
# Video"), so no title-level filter can reject them: they look exactly
# like the K-pop uploads we want. The channel itself has to be pruned
# here. See providers/kworb.py's module docstring.

