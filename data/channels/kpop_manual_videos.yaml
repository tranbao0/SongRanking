# Individually pinned kpop videos - for a song that sits on a channel
# which is mostly a *different* genre (a movie studio, a late-night talk
# show), where adding the whole channel to kpop_manual.yaml would also
# pull in everything else that channel has ever posted.
#
# - video_id: xxxxxxxxxxx
#   channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
#   display_name: Free-text label, for readability only (not matched against anything)
#
# Unlike kpop_manual.yaml, catalog.py never walks this channel's upload
# history - it fetches only the video_id(s) pinned to it here, and skips
# MV title/duration filtering entirely (a pinned video is already a
# deliberate one-by-one choice).

