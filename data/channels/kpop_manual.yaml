# Manually-added kpop channels, for artists and labels Wikidata misses.
# - channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
#   display_name: Artist Name
#
# Wikidata only links an artist to their *own* channel, so label and
# distributor channels have no entry there however much of the genre they
# carry. They are curated here instead.
#
# Only official artist, label, distributor or broadcaster channels belong
# in this file. Fan lyric-video channels and re-uploaders carry the right
# genre but the wrong uploads: their view counts are separate from the
# official release, so counting them splits a song's audience across
# copies rather than measuring it.

